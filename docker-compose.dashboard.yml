version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: cmd/dashboard/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - GO_ENV=production
      - LOG_LEVEL=info
    volumes:
      - ./web:/app/web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a simple backend service for testing
  backend1:
    image: httpd:alpine
    ports:
      - "8082:80"
    volumes:
      - ./examples/backend1.html:/usr/local/apache2/htdocs/index.html
    restart: unless-stopped

  backend2:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./examples/backend2.html:/usr/share/nginx/html/index.html
    restart: unless-stopped

  # Optional: Add Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Optional: Add Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: loadbalancer-network
