name: Enterprise Load Balancer CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.21'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality and Security
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted properly"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run static analysis
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Run security scan
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        run: go test -v -race -tags=integration ./tests/...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  # Performance and Load Testing
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build load balancer
        run: go build -o loadbalancer main.go

      - name: Build dashboard
        run: go build -o dashboard ./cmd/dashboard

      - name: Start test backends
        run: |
          go run examples/test_backend.go :8081 &
          go run examples/test_backend.go :8082 &
          go run examples/test_backend.go :8083 &
          sleep 5

      - name: Start load balancer
        run: |
          ./loadbalancer --config=config.test.json &
          sleep 5

      - name: Start dashboard
        run: |
          ./dashboard --addr=:8085 &
          sleep 5

      - name: Install load testing tools
        run: |
          go install github.com/rakyll/hey@latest
          go install github.com/tsenart/vegeta@latest

      - name: Run medium load test (10K RPS)
        run: |
          echo "Running medium load test..."
          hey -n 10000 -c 50 -t 30s http://localhost:8080/api/test

      - name: Run high load test (50K RPS)
        run: |
          echo "Running high load test..."
          echo "GET http://localhost:8080/api/test" | vegeta attack -rate=50000 -duration=30s | vegeta report

      - name: Run stress test (100K+ RPS)
        run: |
          echo "Running stress test..."
          echo "GET http://localhost:8080/api/test" | vegeta attack -rate=100000 -duration=60s | vegeta report -type=json > stress-test-results.json

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: stress-test-results.json

      - name: Performance benchmarks
        run: go test -bench=. -benchmem ./tests/...

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk security scan
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Docker Build and Push
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, performance-tests]
    if: github.event_name == 'push' || github.event_name == 'release'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          security-opt: no-new-privileges:true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # Kubernetes Deployment
  k8s-deploy:
    name: Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/loadbalancer loadbalancer=${{ needs.docker-build.outputs.image-tag }} -n loadbalancer
          kubectl rollout status deployment/loadbalancer -n loadbalancer

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get pods -n loadbalancer
          kubectl get services -n loadbalancer

  # Chaos Engineering Tests
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    needs: k8s-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup LitmusChaos
        run: |
          kubectl apply -f https://raw.githubusercontent.com/litmuschaos/litmus/master/litmus-operator.yaml
          kubectl wait --for=condition=available --timeout=60s deployment/litmuschaos-operator

      - name: Run chaos experiments
        run: |
          # Pod deletion chaos
          kubectl apply -f chaos/pod-delete-experiment.yaml
          
          # Network latency chaos
          kubectl apply -f chaos/network-latency-experiment.yaml
          
          # CPU stress chaos
          kubectl apply -f chaos/cpu-stress-experiment.yaml

      - name: Verify system resilience
        run: |
          sleep 60
          # Check if system is still responsive
          curl -f http://loadbalancer.example.com/health || exit 1

  # Monitoring and Alerting Setup
  monitoring-setup:
    name: Monitoring Setup
    runs-on: ubuntu-latest
    needs: k8s-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy monitoring stack
        run: |
          kubectl apply -f monitoring/
          kubectl wait --for=condition=available --timeout=120s deployment/prometheus -n monitoring
          kubectl wait --for=condition=available --timeout=120s deployment/grafana -n monitoring

      - name: Configure alerts
        run: |
          kubectl apply -f monitoring/alerts/
          kubectl apply -f monitoring/dashboards/

  # Performance Regression Testing
  performance-regression:
    name: Performance Regression Testing
    runs-on: ubuntu-latest
    needs: k8s-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run performance benchmarks
        run: |
          # Install k6
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

          # Run performance tests
          k6 run --out json=performance-results.json tests/performance/load-test.js

      - name: Compare with baseline
        run: |
          # Compare results with baseline performance
          python scripts/compare_performance.py performance-results.json baseline/performance-baseline.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.json

  # Release and Notification
  release:
    name: Release & Notification
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, performance-tests]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_name: context.payload.release.tag_name,
              body: releaseNotes,
              draft: false,
              prerelease: context.payload.release.prerelease,
            });

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            🚀 Enterprise Load Balancer v${{ github.ref_name }} deployed successfully!
            📊 Performance: 100K+ RPS capability
            🔒 Security: All scans passed
            📈 Image: ${{ needs.docker-build.outputs.image-tag }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Load Balancer v${{ github.ref_name }} Deployed"
          body: |
            Enterprise Load Balancer v${{ github.ref_name }} has been successfully deployed!
            
            📊 Performance: 100K+ RPS capability
            🔒 Security: All scans passed
            🐳 Docker Image: ${{ needs.docker-build.outputs.image-tag }}
            📈 Performance Results: Available in artifacts
            
            Dashboard: https://loadbalancer.example.com
            Grafana: https://grafana.example.com
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "CI/CD Pipeline <ci-cd@example.com>"
