global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'loadbalancer'
    static_configs:
      - targets: ['dashboard:8081']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'backend1'
    static_configs:
      - targets: ['backend1:80']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'backend2'
    static_configs:
      - targets: ['backend2:80']
    metrics_path: '/metrics'
    scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
